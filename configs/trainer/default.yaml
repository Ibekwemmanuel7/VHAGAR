_target_: lightning.Trainer
max_epochs: 60
accelerator: auto
devices: auto
precision: bf16-mixed        # bf16, not fp16: thermal bands have wide dynamic range
gradient_clip_val: 1.0
accumulate_grad_batches: 1
log_every_n_steps: 25
deterministic: true
callbacks:
  early_stopping:
    monitor: val/average_precision
    mode: max
    patience: 10
  checkpoint:
    monitor: val/average_precision
    mode: max
    save_top_k: 3
optimizer:
  _target_: torch.optim.AdamW
  lr: 3.0e-4
  weight_decay: 0.01
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: 60
dataloader:
  batch_size: 16
  num_workers: 8
  pin_memory: true
  persistent_workers: true
