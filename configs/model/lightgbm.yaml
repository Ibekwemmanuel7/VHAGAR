# T1 event classifier and T3 danger heads.
# Gradient boosting is the default, not the fallback: on the closest published
# operational analogue, XGBoost beat both simpler and more complex neural
# architectures, and input data quality mattered more than architecture.
_target_: lightgbm.LGBMClassifier
objective: binary
n_estimators: 2000
learning_rate: 0.02
num_leaves: 63
min_child_samples: 200
subsample: 0.8
subsample_freq: 1
colsample_bytree: 0.7
reg_lambda: 1.0
n_jobs: -1
random_state: 1337
