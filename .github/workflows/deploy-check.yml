# Deploy smoke test: reproduce Render's native-python deploy (install
# serve/requirements.txt, start uvicorn in frozen-snapshot mode) and assert the
# service comes up and serves. This guards the deploy path (render.yaml + the
# serve/demo snapshot), which the ordinary CI (ci.yml: ruff + pytest) does not
# exercise. No Docker: it runs the exact commands Render runs.
name: deploy-check

on:
  push:
    branches: [main]
    paths:
      - render.yaml
      - "serve/**"
      - "src/vhagar/**"
      - vhagar_console.html
  pull_request:
    paths:
      - render.yaml
      - "serve/**"
      - "src/vhagar/**"
      - vhagar_console.html

jobs:
  serve-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (match render.yaml PYTHON_VERSION)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the serving deps (same as Render buildCommand)
        run: |
          python -m pip install --upgrade pip
          pip install -r serve/requirements.txt

      - name: Start uvicorn in frozen-snapshot mode
        env:
          VHAGAR_FROZEN: "1"
          VHAGAR_MAPBOX_TOKEN: pk.ci_dummy
        run: |
          uvicorn serve.vhagar_api:app --host 127.0.0.1 --port 8000 \
            > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "up after ${i}s"; ok=1; break
            fi
            sleep 1
          done
          if [ "${ok:-0}" != "1" ]; then
            echo "::error::health check never passed"; cat /tmp/uvicorn.log; exit 1
          fi

      - name: Assert the endpoints serve
        run: |
          set -euo pipefail
          curl -sf http://127.0.0.1:8000/api/health -o /tmp/health.json
          python3 - <<'PY'
          import json
          h = json.load(open("/tmp/health.json"))
          assert h["status"] == "ok", h
          assert h["detections"] > 0 and h["events"] > 0, h
          print("health ok:", h["detections"], "detections,", h["events"], "events")
          PY
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            'http://127.0.0.1:8000/api/events?region=conus&days=7')
          [ "$code" = "200" ] || { echo "::error::/api/events returned $code"; exit 1; }
          curl -s http://127.0.0.1:8000/console -o /tmp/console.html
          grep -q 'pk.ci_dummy' /tmp/console.html \
            || { echo "::error::token not injected into console"; exit 1; }
          if grep -q '__MAPBOX_TOKEN__' /tmp/console.html; then
            echo "::error::token placeholder left in console"; exit 1
          fi
          kmz=$(curl -s -o /dev/null -w '%{http_code}' \
            'http://127.0.0.1:8000/api/export/kmz?region=conus&days=7')
          [ "$kmz" = "200" ] || { echo "::error::/api/export/kmz returned $kmz"; exit 1; }
          echo "all endpoints served"

      - name: uvicorn log
        if: always()
        run: cat /tmp/uvicorn.log || true

      - name: Stop uvicorn
        if: always()
        run: kill "$(cat /tmp/uvicorn.pid)" 2>/dev/null || true
