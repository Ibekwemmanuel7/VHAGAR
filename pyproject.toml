[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vhagar"
version = "0.1.0"
description = "VHAGAR, multi-sensor wildfire intelligence: detection, burned area, danger, and spread"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "VHAGAR" }]

# Core dependencies only. Everything heavy is an extra so that the metrics,
# splits, indices and FWI modules can be imported and unit-tested in a
# minimal environment (and in CI) without a GDAL/PyTorch install.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
geo = [
  "xarray>=2024.6",
  "rioxarray>=0.15",
  "rasterio>=1.3",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "odc-stac>=0.3.9",
  "odc-geo>=0.4.7",
  "pystac-client>=0.8",
  "zarr>=3.0",
  "dask[array]>=2024.6",
  "pyarrow>=16.0",
]
gee = ["earthengine-api>=1.0", "xee>=0.0.15"]
torch = [
  "torch>=2.3",
  "lightning>=2.3",
  "torchmetrics>=1.4",
  "timm>=1.0",
]
gbdt = ["lightgbm>=4.3", "scikit-learn>=1.5"]
# Everything the Tier A backfill needs and nothing it does not. h5py is listed
# explicitly because pip install h5netcdf does not pull it on Windows, and
# xarray then fails with a bare ImportError that names nothing.
archive = [
  "s3fs>=2024.6",
  "xarray>=2024.6",
  "h5netcdf>=1.3",
  "h5py>=3.11",
  "pyproj>=3.6",
  "pyarrow>=16.0",
]
serve = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "psycopg[binary]>=3.1",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
]
all = ["vhagar[geo,gee,torch,gbdt,serve,archive,dev]"]

[project.scripts]
vhagar = "vhagar.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vhagar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
# B008: typer/FastAPI put the argument spec in the default; that is the idiom.
# UP042: str+Enum is kept for YAML/JSON round-tripping on Python 3.11.
ignore = ["E501", "B008", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "network: requires network access to an external data provider",
  "gee: requires an authenticated Google Earth Engine session",
  "slow: long-running",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
