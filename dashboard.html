<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VHAGAR — Wildfire Intelligence (Live)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--bg:#0b0e13;--panel:#12161f;--panel2:#171c28;--line:#232a38;--tx:#e7ecf3;--dim:#8b97a8;
--fire:#ff5a1f;--hot:#ffb020;--red:#ff3b3b;--green:#38d39f;--blue:#5aa9ff;}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,Segoe UI,Roboto,Helvetica,Arial}
#app{display:grid;grid-template-columns:320px 1fr;grid-template-rows:56px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 18px;background:var(--panel);
border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.5px;font-size:16px}
.brand b{color:var(--fire)}
.live{display:flex;align-items:center;gap:6px;color:var(--red);font-weight:700;font-size:12px;text-transform:uppercase}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(255,59,59,.6);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,59,.6)}70%{box-shadow:0 0 0 10px rgba(255,59,59,0)}100%{box-shadow:0 0 0 0 rgba(255,59,59,0)}}
.chips{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--dim)}
.chip b{color:var(--tx);font-size:14px}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 8px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.fire{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.fire:hover{background:var(--panel2);border-color:var(--line)}
.rank{width:22px;height:22px;border-radius:6px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:var(--dim)}
.fmeta{flex:1;min-width:0}.fmeta .loc{font-weight:600}.fmeta .sub{font-size:11px;color:var(--dim)}
.frp{font-weight:800;color:var(--hot);white-space:nowrap}
#map{height:100%}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.m .k{font-size:11px;color:var(--dim)}.m .v{font-size:18px;font-weight:800}
.bar{height:6px;border-radius:4px;background:#0e1420;margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px}
.legend{position:absolute;bottom:14px;left:340px;z-index:500;background:rgba(18,22,31,.9);border:1px solid var(--line);
border-radius:8px;padding:8px 10px;font-size:11px;color:var(--dim)}
.legend .row{display:flex;align-items:center;gap:6px;margin:3px 0}
.sw{width:12px;height:12px;border-radius:50%}
.foot{font-size:11px;color:var(--dim);padding:10px 14px}
a{color:var(--blue);text-decoration:none}
</style></head>

function frpRad(f){return f>1000?6:f>300?4.5:f>80?3.2:2.2;}
DATA.points.forEach(p=>{

  fillColor:frpColor(p[2]),fillOpacity:.75}).addTo(map);
});
const fireLayer=L.layerGroup().addTo(map);
DATA.fires.forEach((f,i)=>{

});
