# TerraTorch fine-tune config for Prithvi-EO-2.0-300M on VHAGAR's six-band burn-scar chips.
# Adapted from ibm-nasa-geospatial/Prithvi-EO-2.0-300M-BurnScars/burn_scars_config.yaml.
# Only the data paths and the normalization means/stds differ from the published config:
# the means/stds below were computed from THIS dataset's 15 training fires (valid pixels
# only, no val/test leakage), so they match Sentinel-2 L2A reflectance rather than HLS.
# Run:  terratorch fit -c prithvi_burnscars_vhagar.yaml     (needs a GPU + pretrained weights)
# lightning.pytorch==2.4.0
seed_everything: 2
trainer:
  logger: true
  max_epochs: 100
  log_every_n_steps: 1
  callbacks:
    - class_path: EarlyStopping
      init_args:
        monitor: val/loss
        patience: 15
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
  enable_progress_bar: true
  precision: bf16-mixed

model:
  class_path: terratorch.tasks.SemanticSegmentationTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: prithvi_eo_v2_300
      backbone_pretrained: true
      backbone_bands: ["BLUE", "GREEN", "RED", "NIR_NARROW", "SWIR_1", "SWIR_2"]
      necks:
        - name: SelectIndices
          indices: [5, 11, 17, 23]
        - name: ReshapeTokensToImage
        - name: LearnedInterpolateToPyramidal
      decoder: UNetDecoder
      decoder_channels: [512, 256, 128, 64]
      num_classes: 2
    loss: ce
    ignore_index: -1
    freeze_backbone: false
    plot_on_val: false
    class_names: [Not burned, Burn scar]

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1.e-4
lr_scheduler:
  class_path: ReduceLROnPlateau
  init_args:
    monitor: val/loss
    factor: 0.5
    patience: 4

data:
  class_path: GenericNonGeoSegmentationDataModule
  init_args:
    batch_size: 8
    num_workers: 8
    dataset_bands: [BLUE, GREEN, RED, NIR_NARROW, SWIR_1, SWIR_2]
    output_bands: [BLUE, GREEN, RED, NIR_NARROW, SWIR_1, SWIR_2]
    rgb_indices: [2, 1, 0]
    # All three roots point at the single chip directory; the split .txt files partition it.
    train_data_root: data/t2_prithvi_chips/data
    val_data_root: data/t2_prithvi_chips/data
    test_data_root: data/t2_prithvi_chips/data
    train_split: data/t2_prithvi_chips/splits/train.txt
    val_split: data/t2_prithvi_chips/splits/val.txt
    test_split: data/t2_prithvi_chips/splits/test.txt
    img_grep: "*_merged.tif"
    label_grep: "*.mask.tif"
    # Per-band means/stds computed from THIS dataset's training fires (see header).
    means: [0.049771, 0.068685, 0.076481, 0.214572, 0.204851, 0.146201]
    stds:  [0.031063, 0.036317, 0.049595, 0.085017, 0.094316, 0.082628]
    num_classes: 2
    train_transform:
      - class_path: albumentations.D4
      - class_path: ToTensorV2
    test_transform:
      - class_path: ToTensorV2
    no_data_replace: 0
    no_label_replace: -1
