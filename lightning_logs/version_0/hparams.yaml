model_args:
  backbone: prithvi_eo_v2_300
  backbone_pretrained: true
  backbone_bands:
  - BLUE
  - GREEN
  - RED
  - NIR_NARROW
  - SWIR_1
  - SWIR_2
  necks:
  - name: SelectIndices
    indices:
    - 5
    - 11
    - 17
    - 23
  - name: ReshapeTokensToImage
  - name: LearnedInterpolateToPyramidal
  decoder: UNetDecoder
  decoder_channels:
  - 512
  - 256
  - 128
  - 64
  num_classes: 2
model_factory: EncoderDecoderFactory
model: null
loss: ce
aux_heads: null
aux_loss: null
class_weights: null
ignore_index: -1
lr: 0.001
optimizer: null
optimizer_hparams: null
scheduler: null
scheduler_hparams: null
freeze_backbone: false
freeze_decoder: false
freeze_head: false
plot_on_val: false
class_names:
- Not burned
- Burn scar
tiled_inference_parameters: null
test_dataloaders_names: null
lr_overrides: null
output_on_inference: prediction
output_most_probable: true
path_to_record_metrics: null
tiled_inference_on_testing: false
tiled_inference_on_validation: false
_instantiator: lightning.pytorch.cli.instantiate_module
