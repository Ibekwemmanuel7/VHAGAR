<style>
:root{--bg:#0E1117;--panel:#141a24;--panel2:#12151C;--btn:#1E2430;--line:#242a35;--line2:#2c3543;
 --text:#EAECEF;--muted:#9aa4b2;--dim:#5f6b7d;--ice:#5cc8ff;--ice2:#8fdcff;--ember:#ff7a1a;
 --low:#2E9E5B;--mod:#E0B43A;--high:#E8552B;--ext:#B71C1C;}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#app{height:100%}
body{font-family:"Times New Roman",Times,serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
select{font-family:inherit}
#app{display:flex;flex-direction:column}
.hdr{height:56px;flex:none;background:rgba(18,21,28,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
 display:flex;align-items:center;gap:.75rem;padding:0 1rem;z-index:20}
.brand{display:flex;align-items:center;gap:.55rem;margin-right:.4rem}
.brand img{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 1px rgba(92,200,255,.7),0 0 10px rgba(92,200,255,.3)}
.brand .n{font-weight:800;font-size:1rem;letter-spacing:.3px;color:var(--ice)}
.brand .wordmark{height:28px;width:auto;display:block;filter:drop-shadow(0 0 5px rgba(120,215,255,.6)) drop-shadow(0 0 13px rgba(40,140,255,.38))}
.brand .bcol{display:flex;flex-direction:column;justify-content:center;gap:1px}
.brand .btag{font-size:.6rem;color:var(--muted);letter-spacing:.2px;line-height:1.25;white-space:nowrap}
.brand .n b{color:var(--ice);margin-left:1px}
.divider{width:1px;height:24px;background:var(--line2);margin:0 .3rem}
.livewrap{display:flex;align-items:center;gap:.4rem}
.livewrap .dot{width:9px;height:9px;border-radius:50%}
.livewrap.live .dot{background:#4ade80;animation:pulse 2s infinite}
.livewrap.sample .dot{background:#facc15}.livewrap.offline .dot{background:#f87171}
.livewrap span{font-size:.72rem;font-weight:700;color:#d5dae2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.5)}70%{box-shadow:0 0 0 6px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.field{display:flex;align-items:center;gap:.4rem}
.field label{font-size:.72rem;color:var(--muted)}
.field select{background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:7px;padding:.32rem .5rem;font-size:.8rem;outline:none;cursor:pointer}
.spacer{margin-left:auto}
.updated{font-size:.72rem;color:var(--dim);white-space:nowrap}
.refresh{display:flex;align-items:center;gap:.4rem;background:var(--ember);color:#160a02;border:none;border-radius:8px;padding:.4rem .7rem;font-size:.78rem;font-weight:700}
.refresh:hover{filter:brightness(1.08)}.refresh.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{flex:none;background:#0b0e14;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.4rem;padding:.4rem 1rem;overflow-x:auto}
.tabs .lab{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-right:.2rem}
.tab{font-size:.74rem;font-weight:600;padding:.28rem .7rem;border-radius:99px;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);white-space:nowrap}
.tab.on{background:rgba(92,200,255,.18);border-color:var(--ice);color:var(--ice2)}
.tabs .note{margin-left:auto;font-size:.66rem;color:var(--dim)}
.danger{flex:none;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;font-size:.78rem;color:var(--muted);
 border-bottom:1px solid var(--line);padding:.4rem 1rem;background:#0b0e14}
.danger .lab{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ice);font-weight:700}
.danger b{color:var(--text);font-weight:700}
.danger .dq{padding-left:.9rem;border-left:1px solid var(--line2);white-space:nowrap}
.danger .fine{color:var(--dim);font-size:.66rem;font-style:italic;margin-left:auto;text-align:right;max-width:24rem}
.body{flex:1;display:flex;min-height:0}
.side{width:320px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.side .title{padding:.9rem 1rem;border-bottom:1px solid var(--line)}
.side .title .row{display:flex;align-items:center;gap:.5rem}
.side .title h1{font-size:1.05rem;font-weight:800}.side .title h1 b{color:var(--ice)}
.side .title p{font-size:.72rem;color:var(--muted);margin-top:.2rem}
.exports{display:flex;gap:.5rem;padding:.7rem}
.exports a{flex:1;text-align:center;text-decoration:none;font-size:.74rem;font-weight:600;padding:.5rem;border-radius:8px;background:var(--btn);border:1px solid var(--line2);color:var(--text)}
.exports a:hover{background:#28303d}
.side .cnt{padding:0 1rem .3rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.cards{flex:1;overflow-y:auto;padding:0 .7rem .8rem;display:flex;flex-direction:column;gap:.5rem}
.cards::-webkit-scrollbar{width:8px}.cards::-webkit-scrollbar-thumb{background:#232b38;border-radius:8px}
.card{text-align:left;width:100%;border:1px solid var(--line);border-left-width:4px;background:var(--panel2);border-radius:9px;padding:.6rem .7rem;cursor:pointer;transition:.14s}
.card:hover{border-color:var(--line2)}.card.sel{border-color:var(--ember);background:#232b38}
.card .r1{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.card .name{font-weight:700;font-size:.88rem}
.badge{font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid;white-space:nowrap}
.blab{font-size:.5rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:5px;vertical-align:middle;cursor:help}
.card .grid{margin-top:.45rem;display:grid;grid-template-columns:1fr 1fr;gap:.15rem .8rem;font-size:.74rem;color:var(--muted)}
.card .grid b{color:var(--text);font-weight:600}
.empty{padding:1.2rem;color:var(--dim);font-size:.82rem;text-align:center}
.main{flex:1;position:relative;min-width:0;min-height:50vh}
#map{position:absolute;inset:0;background:#0a0e14}
.mapboxgl-popup-content{background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:10px;font-size:12px;padding:11px 13px}
.mapboxgl-popup-tip{border-top-color:var(--panel2)!important;border-bottom-color:var(--panel2)!important}
.mapboxgl-popup-close-button{color:var(--muted);font-size:15px}
.mapboxgl-ctrl-group{background:var(--panel2)!important;border:1px solid var(--line)!important}
.legend{position:absolute;left:14px;bottom:26px;z-index:5;background:rgba(18,21,28,.92);backdrop-filter:blur(6px);
 border:1px solid var(--line2);border-radius:10px;padding:.65rem .75rem;font-size:.72rem;width:186px}
.legend h4{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:.4rem}
.legend .ramp{display:flex;height:9px;border-radius:4px;overflow:hidden;margin-bottom:.15rem}.legend .ramp i{flex:1}
.legend .ends{display:flex;justify-content:space-between;font-size:.6rem;color:var(--dim);margin-bottom:.45rem}
.legend .row{display:flex;align-items:center;gap:.5rem;color:var(--muted);margin:.22rem 0}.legend .sw{width:12px;height:12px;border-radius:50%;flex:none}
.advis{position:absolute;right:14px;top:14px;z-index:5;max-width:290px;background:rgba(18,21,28,.92);backdrop-filter:blur(6px);
 border:1px dashed var(--line2);border-radius:10px;padding:.55rem .7rem;font-size:.68rem;color:var(--muted);line-height:1.45}
.overlay{position:absolute;inset:0;z-index:8;display:none;place-items:center;text-align:center;background:#0a0e14;color:var(--muted);padding:2rem}
.overlay code{color:var(--ice2);background:#0f1830;padding:2px 6px;border-radius:5px}
.err{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:9;background:rgba(226,59,59,.12);border:1px solid #e23b3b;color:#ffb4b4;font-size:.74rem;padding:.5rem .9rem;border-radius:9px;display:none;max-width:70%;text-align:center}
.drawer{position:absolute;right:0;top:0;bottom:0;width:330px;z-index:7;background:var(--panel);border-left:1px solid var(--line2);
 box-shadow:-12px 0 40px rgba(0,0,0,.45);transform:translateX(100%);transition:.24s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer .dh{padding:.9rem 1rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem}
.drawer .dh .t{font-size:1.05rem;font-weight:800}.drawer .dh .cls{font-size:.66rem;color:var(--dim);margin-top:.2rem}
.drawer .x{background:none;border:none;color:var(--muted);font-size:1.3rem;line-height:1}
.dbody{overflow-y:auto;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.85rem}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.metric{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:.5rem .6rem}
.metric .k{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.metric .v{font-size:1.05rem;font-weight:700;margin-top:.1rem}.metric .v small{font-size:.68rem;color:var(--muted);font-weight:500}
.wx{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:.55rem .7rem;font-size:.78rem;color:var(--muted)}
.wx .r{display:flex;justify-content:space-between;padding:.16rem 0}.wx .r b{color:var(--text);font-weight:600}
.note{font-size:.66rem;color:var(--dim);line-height:1.5}
@media(max-width:820px){.side{display:none}}
</style></head>

function riskBadge(rc){const c=RISK[rc]||"#8A8F98";return `<span class="badge" title="Spread-risk class from current weather (wind, RH, temp), not fire power" style="color:${c};border-color:${c};background:${c}22">${rc||"n/a"}</span>`;}
const num=(v,d=1)=>v==null||isNaN(+v)?"-":(+v).toLocaleString(undefined,{maximumFractionDigits:d});
const empty=()=>({type:"FeatureCollection",features:[]});
function esc(v){return String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

let map=null,popup=null,fitted=null,styleReady=false;
const FRP_COLOR=["interpolate",["linear"],["coalesce",["get","frp_mw"],0],0,"#FFE08A",20,"#FF7A33",100,"#B71C1C"];
const FRP_AT=(a,b,c)=>["interpolate",["linear"],["coalesce",["get","frp_mw"],0],0,a,50,b,200,c];
const FRP_RADIUS=["interpolate",["linear"],["zoom"],4,FRP_AT(2.4,4.5,7),7,FRP_AT(3.2,6,11),10,FRP_AT(4.5,9,15)];
const GLOW_RADIUS=["interpolate",["linear"],["zoom"],4,FRP_AT(5,10,15),7,FRP_AT(7,13,22),10,FRP_AT(10,18,30)];
const PERIM=["interpolate",["linear"],["coalesce",["get","max_frp_mw"],0],0,"#8fa0c0",200,"#E0B43A",1000,"#E8552B",2500,"#B71C1C"];
function showOverlay(msg){document.getElementById("ovmsg").innerHTML=msg;document.getElementById("overlay").style.display="grid";}
function initMap(){
 if(!MAPBOX_TOKEN){showOverlay('<div style="font-size:1.3rem;margin-bottom:.5rem">Mapbox token needed</div>Set <code>VHAGAR_MAPBOX_TOKEN</code> before starting the server, then reload.<br>Free token: mapbox.com/account/access-tokens');return;}
 try{
  mapboxgl.accessToken=MAPBOX_TOKEN;
  map=new mapboxgl.Map({container:"map",style:BASEMAPS[state.basemap],center:[VIEW.california[0],VIEW.california[1]],zoom:VIEW.california[2],attributionControl:true});
  map.addControl(new mapboxgl.NavigationControl(),"bottom-right");
  map.on("load",()=>{styleReady=true;addLayers();pushData();map.resize();});
  map.on("error",e=>{const msg=(e&&e.error&&e.error.message)||"";
   if(/access token|Unauthorized|401|not authorized|403/i.test(msg))
    showOverlay('<div style="font-size:1.3rem;margin-bottom:.5rem">Mapbox rejected the token</div>'+esc(msg)
     +'<br><br>Check the token is valid and that its URL restrictions allow <code>http://127.0.0.1:8000</code> (or remove the restriction in your Mapbox account).');});
  new ResizeObserver(()=>{if(map)map.resize();}).observe(document.getElementById("map"));
 }catch(err){showOverlay("Map failed to initialise: "+esc(String(err)));}
}
function addLayers(){
 if(!map||map.getSource("events"))return;
 map.addSource("events",{type:"geojson",data:empty()});
 map.addSource("detections",{type:"geojson",data:empty()});
 map.addSource("winds",{type:"geojson",data:empty()});
 map.addLayer({id:"events-fill",type:"fill",source:"events",paint:{"fill-color":PERIM,"fill-opacity":.16}});
 map.addLayer({id:"events-line",type:"line",source:"events",paint:{"line-color":PERIM,"line-width":["interpolate",["linear"],["zoom"],4,1,8,1.8,11,2.6],"line-dasharray":[3,2],"line-opacity":.9}});
 map.addLayer({id:"events-sel",type:"line",source:"events",filter:["==",["get","event_id"],-1],paint:{"line-color":"#5cc8ff","line-width":3.2}});
 map.addLayer({id:"det-glow",type:"circle",source:"detections",paint:{"circle-radius":GLOW_RADIUS,"circle-color":FRP_COLOR,"circle-opacity":.12,"circle-blur":1}});
 map.addLayer({id:"det-pt",type:"circle",source:"detections",paint:{"circle-radius":FRP_RADIUS,"circle-color":FRP_COLOR,"circle-opacity":.88,"circle-stroke-color":"#00000055","circle-stroke-width":.4}});
 map.addLayer({id:"wind",type:"symbol",source:"winds",layout:{"text-field":"↑","text-rotate":["get","bearing"],"text-allow-overlap":true,"text-size":["interpolate",["linear"],["get","wind"],0,15,15,28]},paint:{"text-color":"#5cc8ff","text-halo-color":"#000","text-halo-width":1.1}});
 map.on("click","events-fill",e=>selectEvent(+e.features[0].properties.event_id));
 map.on("mouseenter","events-fill",()=>map.getCanvas().style.cursor="pointer");
 map.on("mouseleave","events-fill",()=>map.getCanvas().style.cursor="");
}
function filterSensor(fc,isDet){
 if(!fc)return empty(); if(state.sensor==="all")return fc;
 return {type:"FeatureCollection",features:fc.features.filter(f=>{const p=f.properties;
   return isDet?(p.sensor===state.sensor):String(p.sensors||"").includes(state.sensor);})};
}
function windsFC(ev){return {type:"FeatureCollection",features:(ev.features||[])
  .filter(f=>f.properties.wind_dir_deg!=null&&f.properties.centroid_lat!=null)
  .map(f=>({type:"Feature",geometry:{type:"Point",coordinates:[f.properties.centroid_lon,f.properties.centroid_lat]},
    properties:{bearing:(Number(f.properties.wind_dir_deg)+180)%360,wind:Number(f.properties.wind_speed_ms)||0}}))};}
function pushData(){
 if(!map||!styleReady||!map.getSource("events"))return;
 const ev=filterSensor(state.events,false),det=filterSensor(state.dets,true);
 map.getSource("events").setData(ev); map.getSource("detections").setData(det); map.getSource("winds").setData(windsFC(ev));
 if(fitted!==state.region+state.sensor&&ev.features.length){
  const b=new mapboxgl.LngLatBounds();
  ev.features.forEach(f=>{const g=f.geometry;if(!g)return;const walk=c=>{if(typeof c[0]==="number")b.extend(c);else c.forEach(walk);};walk(g.coordinates);});
  if(!b.isEmpty()){map.fitBounds(b,{padding:60,maxZoom:9,duration:800});fitted=state.region+state.sensor;}
 }
}
function setBasemap(b){state.basemap=b;if(!map)return;styleReady=false;map.setStyle(BASEMAPS[b]);
 map.once("style.load",()=>{styleReady=true;addLayers();pushData();map.resize();});}
function popupHTML(p){const fdc=isFDC();
 return `<div style="min-width:190px"><div style="font-weight:700;font-size:13px;margin-bottom:3px">${esc(p.label||("Event "+p.event_id))}</div>`
  +(fdc?`<div>Peak FRP <b>${num(p.max_frp_mw)}</b> MW &middot; ${num(p.n_detections,0)} px</div><div>Footprint <b>${num(p.footprint_ha!=null?p.footprint_ha:p.area_ha,0)}</b> ha</div>`
       :`<div>Spread risk ${p.risk_class} (${num(p.risk_score,0)})</div><div>Area <b>${num(p.area_ha,0)}</b> ha &middot; FRP <b>${num(p.total_frp_mw)}</b> MW</div>`)
  +(p.wind_speed_ms!=null?`<div>Wind <b>${num(p.wind_speed_ms)}</b> m/s @ ${num(p.wind_dir_deg,0)}&deg;</div>`:"")
  +`<div style="color:#9aa4b2">${esc(p.sensors||"")}</div></div>`;}

function renderExports(){const q=`region=${state.region}&days=${state.days}`;
 document.getElementById("exports").innerHTML=
  `<a href="${API}/api/export/geojson?${q}" target="_blank" rel="noopener">&#8595; GeoJSON</a>
   <a href="${API}/api/export/kmz?${q}" target="_blank" rel="noopener">&#8595; KMZ</a>`;}
function renderTabs(){
 const det=(state.dets&&state.dets.features)||[];
 const sensors=[...new Set(det.map(f=>f.properties.sensor).filter(Boolean))].sort();
 const opts=["all",...sensors];
 if(!opts.includes(state.sensor))state.sensor="all";
 const el=document.getElementById("tabs");
 el.innerHTML='<span class="lab">Sensor</span>'
   +`<select id="sensorSel">`+opts.map(s=>`<option value="${s}" ${state.sensor===s?"selected":""}>${s==="all"?"All sensors":s}</option>`).join("")+`</select>`
   +`<span class="note">${isFDC()?"GOES ABI FDC":"multi-sensor"}</span>`;
 document.getElementById("sensorSel").onchange=e=>{state.sensor=e.target.value;fitted=null;render();};
}
function renderFeed(){
 const fdc=isFDC();
 const rank=p=>({Extreme:4,High:3,Moderate:2,Low:1}[p.risk_class])||((+p.max_frp_mw||0)>1000?3:(+p.max_frp_mw||0)>200?2:1);
 const ev=[...filterSensor(state.events,false).features].sort((a,b)=>rank(b.properties)-rank(a.properties)||(+b.properties.max_frp_mw||0)-(+a.properties.max_frp_mw||0)||(+b.properties.risk_score||0)-(+a.properties.risk_score||0));
 document.getElementById("cnt").textContent=ev.length+" events "+(state.mode==="live"?"· live":"· sample");
 const el=document.getElementById("cards");
 if(!ev.length){el.innerHTML='<div class="empty">No fire events in this region and window.</div>';return;}
 el.innerHTML=ev.map(f=>{const p=f.properties;
  const hasRisk=p.risk_class&&p.risk_class!=="Unknown";
  const c=hasRisk?(RISK[p.risk_class]||"#8A8F98"):(fdc?frpFill(p.max_frp_mw):"#8A8F98");
  // Self-label the tier so spread risk (weather-driven) is never read as fire
  // power: a 2 MW fire can be Low FRP but High spread risk. Two quantities, named.
  const badge=hasRisk
   ? `<span class="blab" title="Spread-risk class from current weather (wind, RH, temp), not fire power">risk</span>${riskBadge(p.risk_class)}`
   : (fdc?`<span class="blab" title="Peak fire radiative power tier">FRP</span>${frpBadge(p.max_frp_mw)}`:riskBadge(p.risk_class));
  const grid=fdc
   ? `<span>Area: <b>${num(p.footprint_ha,0)}</b> ha</span><span>FRP: <b>${num(p.max_frp_mw,0)}</b> MW</span><span>Wind: <b>${num(p.wind_speed_ms)}</b> m/s</span><span>RH: <b>${num(p.rh_pct,0)}</b>%</span><span>Detections: <b>${num(p.n_detections,0)}</b></span><span>Sensor: <b>${(p.sensors||"-").replace("GOES-","G")}</b></span>`
   : `<span>Area: <b>${num(p.area_ha,0)}</b> ha</span><span>FRP: <b>${num(p.total_frp_mw)}</b> MW</span><span>Wind: <b>${num(p.wind_speed_ms)}</b> m/s</span><span>RH: <b>${num(p.rh_pct,0)}</b>%</span>`;
  return `<button class="card ${state.sel===p.event_id?"sel":""}" data-id="${p.event_id}" style="border-left-color:${c}">
   <div class="r1"><span class="name">${esc(p.label||("Event "+p.event_id))}</span>${badge}</div><div class="grid">${grid}</div></button>`;}).join("");
 el.querySelectorAll(".card").forEach(x=>x.onclick=()=>selectEvent(+x.dataset.id));
}
async function loadDanger(){
 const el=document.getElementById("danger");
 try{const d=await getJSON("/v1/danger");const fd=d.fire_danger||{};
  const igp=d.ignition_probability!=null?(d.ignition_probability*100).toFixed(2)+"%":"n/a";
  el.innerHTML='<span class="lab">Fire danger &middot; T3</span>'
   +`<span class="dq">FWI <b>${num(fd.fwi)}</b> ${fd.class||""}</span>`
   +`<span class="dq">Ignition prob. <b>${igp}</b></span>`
   +`<span class="dq">Expected burned area <b>${num(d.expected_burned_area_ha,0)}</b> ha</span>`
   +'<span class="fine">Three separate quantities, never one combined risk score. FWI from live weather; ignition and burned-area models pending real-data training.</span>';
  el.style.display="flex";}catch(e){el.style.display="none";}
}

function eventById(id){return ((state.events&&state.events.features)||[]).find(f=>f.properties.event_id===id);}
function selectEvent(id){
 state.sel=id;renderFeed();
 if(map&&map.getLayer("events-sel"))map.setFilter("events-sel",["==",["get","event_id"],id]);
 const f=eventById(id);if(!f)return;const p=f.properties;
 if(map){map.flyTo({center:[p.centroid_lon,p.centroid_lat],zoom:9,duration:800});
  if(popup)popup.remove();popup=new mapboxgl.Popup({offset:12}).setLngLat([p.centroid_lon,p.centroid_lat]).setHTML(popupHTML(p)).addTo(map);}
 openDrawer(p);
}
function metric(k,v,u){return `<div class="metric"><div class="k">${k}</div><div class="v">${v}${u?` <small>${u}</small>`:""}</div></div>`;}
function openDrawer(p){const fdc=isFDC();
 document.getElementById("d_name").textContent=p.label||("Event "+p.event_id);
 document.getElementById("d_cls").innerHTML=fdc?`Peak FRP ${frpBadge(p.max_frp_mw)} &middot; ${num(p.max_frp_mw,0)} MW`:`Spread risk ${riskBadge(p.risk_class)} &middot; ${num(p.risk_score,0)}`;
 const clean=s=>(s||"-").replace("T"," ").replace("Z","").slice(0,19);
 const metrics=fdc
  ?`<div class="metrics">${metric("Detection footprint",num(p.footprint_ha!=null?p.footprint_ha:p.area_ha,0),"ha")}${metric("Hull perimeter",num(p.perimeter_km),"km")}${metric("Peak FRP",num(p.max_frp_mw),"MW")}${metric("Mean FRP",num(p.mean_frp_mw),"MW")}${metric("Detections",num(p.n_detections,0),"px")}${metric("Cumulative FRP",num(p.total_frp_mw,0),"MW")}</div>`
  :`<div class="metrics">${metric("Burned area",num(p.area_ha,0),"ha")}${metric("Perimeter",num(p.perimeter_km),"km")}${metric("Total FRP",num(p.total_frp_mw),"MW")}${metric("Max FRP",num(p.max_frp_mw),"MW")}${metric("Detections",num(p.n_detections,0),"")}${metric("Sensors",(p.sensors||"-").split(",").length,"feeds")}</div>`;
 const hasWx=p.wind_speed_ms!=null||p.temp_c!=null;
 const riskLine=(p.risk_class&&p.risk_class!=="Unknown")?`<div class="r"><span>Spread risk (current wx)</span><b>${p.risk_class} (${num(p.risk_score,0)})</b></div>`:"";
 const wxLines=hasWx?`<div class="r"><span>Wind</span><b>${num(p.wind_speed_ms)} m/s @ ${num(p.wind_dir_deg,0)}&deg;</b></div><div class="r"><span>RH / Temp</span><b>${num(p.rh_pct,0)}% / ${num(p.temp_c)}&deg;C</b></div>`:"";
 const wx=`<div class="wx">${riskLine}${wxLines}<div class="r"><span>Sensors</span><b>${p.sensors||"-"}</b></div><div class="r"><span>First seen</span><b>${clean(p.first_seen)} UTC</b></div><div class="r"><span>Last seen</span><b>${clean(p.last_seen)} UTC</b></div></div>`;
 const q=`region=${state.region}&days=${state.days}`;
 const exports=`<div class="exports" style="padding:0"><a href="${API}/api/export/geojson?${q}" target="_blank" rel="noopener">GeoJSON</a><a href="${API}/api/export/kmz?${q}" target="_blank" rel="noopener">KMZ</a></div>`;
 const note=fdc?`Perimeter: ${p.perimeter_method||"detection convex hull"}. The footprint is the hull of GOES FDC detection pixels, a detection extent, not a burned-area measurement.`:`Perimeter method: ${p.perimeter_method||"alpha-shape"}.`;
 document.getElementById("d_body").innerHTML=metrics+wx+exports+`<div class="note">${note}</div>`;
 document.getElementById("drawer").classList.add("open");
}
document.getElementById("d_x").onclick=()=>{document.getElementById("drawer").classList.remove("open");state.sel=null;if(map&&map.getLayer("events-sel"))map.setFilter("events-sel",["==",["get","event_id"],-1]);renderFeed();};

async function getJSON(path){const c=new AbortController();const t=setTimeout(()=>c.abort(),25000);
 try{const r=await fetch(API+path,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json();}finally{clearTimeout(t);}}
function setLive(mode,offline){const w=document.getElementById("livewrap"),x=document.getElementById("livetxt");
 if(!w||!x)return;
 w.className="livewrap "+(offline?"offline":mode==="live"?"live":"sample");x.textContent=offline?"OFFLINE":mode==="live"?"LIVE":"SAMPLE";}
function showErr(m){const e=document.getElementById("err");if(!m){e.style.display="none";return;}e.textContent=m;e.style.display="block";}
async function load(){
 const btn=document.getElementById("refresh");btn.classList.add("spin");showErr("");
 const q=`region=${state.region}&days=${state.days}`;
 let ok=false;
 for(let attempt=0;attempt<4&&!ok;attempt++){
  if(attempt){showErr("Waking the live service, retrying...");await new Promise(r=>setTimeout(r,3000*attempt));}
  try{const [ev,det]=await Promise.all([getJSON("/api/events?"+q),getJSON("/api/detections?"+q)]);
   state.events=ev;state.dets=det;state.mode=(ev.metadata&&ev.metadata.mode)||"live";
   state.schema=(ev.metadata&&ev.metadata.schema)||"events";state.source=(ev.metadata&&ev.metadata.source)||"";
   setLive(state.mode,false);showErr("");ok=true;
  }catch(e){/* free-tier cold start can take up to a minute; retry with backoff */}
 }
 if(!ok){state.events=SAMPLE_EVENTS;state.dets=SAMPLE_DETS;state.mode="sample";state.schema="events";state.source="";setLive("sample",true);
  showErr("Live backend not reachable right now, showing a bundled sample. Press Refresh to retry.");}
 render();document.getElementById("updated").textContent="updated "+new Date().toLocaleTimeString();
 btn.classList.remove("spin");
}
function applyChrome(){const fdc=isFDC();
 document.getElementById("advis").innerHTML=fdc
  ?`<b>${esc(state.source||"GOES ABI FDC")}</b>. Candidate fire pixels clustered into events by VHAGAR's parallax-aware fusion. The polygon is the detection convex hull, a detection extent, not a burned-area measurement.`
  :`Satellite-derived perimeters and detections. Each is a candidate for verification, not a confirmed event.`;
 const anyWind=((state.events&&state.events.features)||[]).some(f=>f.properties.wind_dir_deg!=null);
 document.getElementById("lgwind").style.display=anyWind?"flex":"none";
}
function render(){applyChrome();renderExports();renderTabs();renderFeed();pushData();}

const rsel=document.getElementById("region");
rsel.innerHTML=Object.entries(REGIONS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
rsel.value=state.region;
rsel.onchange=()=>{state.region=rsel.value;state.sel=null;fitted=null;const v=VIEW[state.region];if(map&&v)map.flyTo({center:[v[0],v[1]],zoom:v[2]});load();};
document.getElementById("days").onchange=e=>{state.days=+e.target.value;load();};
document.getElementById("basemap").onchange=e=>setBasemap(e.target.value);
document.getElementById("refresh").onclick=()=>load();
window.addEventListener("resize",()=>{if(map)map.resize();});
setInterval(load,REFRESH_MS);
initMap();load();loadDanger();
</script></body></html>
